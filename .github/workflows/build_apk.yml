name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Download repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Java
      # =========================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================
      # 3. Flutter
      # =========================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # =========================
      # 4. Generate Android project
      # =========================
      - name: Generate Android project
        run: |
          flutter create \
            --org com.yemenchat \
            --project-name yemen_chat \
            --platforms=android \
            .

      # =========================
      # 5. Write Firebase config
      # =========================
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # =========================
      # 6. Check Firebase config
      # =========================
      - name: Check google-services.json
        run: |
          if [ ! -s android/app/google-services.json ]; then
            echo "::error::google-services.json is empty."
            echo "Please add GOOGLE_SERVICES_JSON in:"
            echo "Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "google-services.json found successfully."

      # =========================
      # 7. Configure Android
      # =========================
      - name: Configure Android
        run: |
          python3 apply_android_setup.py

      # =========================
      # 8. Show Android configuration
      # =========================
      - name: Show Android configuration
        run: |
          echo "======================================"
          echo "Android settings"
          echo "======================================"

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          fi

          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          fi

          echo ""
          echo "======================================"
          echo "Gradle wrapper"
          echo "======================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

      # =========================
      # 9. Create .env
      # =========================
      - name: Create .env
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      # =========================
      # 10. Flutter dependencies
      # =========================
      - name: Flutter pub get
        run: |
          flutter pub get

      # =========================
      # 11. Flutter doctor
      # =========================
      - name: Flutter doctor
        run: |
          flutter doctor -v

      # =========================
      # 12. Analyze project
      # =========================
      - name: Flutter analyze
        run: |
          flutter analyze
        continue-on-error: true

      # =========================
      # 13. Clean project
      # =========================
      - name: Flutter clean
        run: |
          flutter clean

      # =========================
      # 14. Get dependencies again
      # =========================
      - name: Flutter pub get after clean
        run: |
          flutter pub get

      # =========================
      # 15. Patch plugin compileSdk versions
      # =========================
      # MUST run after the last `flutter pub get` (packages must already be
      # on disk under pub-cache). Directly patches compileSdkVersion inside
      # plugin packages (e.g. livekit_client) that declare an older value
      # than they actually need, fixing:
      #   "AAPT: error: resource android:attr/lStar not found"
      - name: Patch plugin compileSdk versions
        run: |
          python3 patch_plugin_compilesdk.py

      # =========================
      # 16. Build APK
      # =========================
      - name: Build APK
        run: |
          flutter build apk --release

      # =========================
      # 17. Check APK
      # =========================
      - name: Check APK
        run: |
          echo "======================================"
          echo "APK files:"
          echo "======================================"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

      # =========================
      # 18. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-chat-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
