name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # android/ and ios/ are not committed to the repo, so generate them here.
      # This keeps the existing lib/ and pubspec.yaml untouched.
      - name: Generate android/ project files
        run: flutter create --org com.yemenchat --project-name yemen_chat --platforms=android .

      # google-services.json is required to build with Firebase.
      # Add its full content as a repo secret named GOOGLE_SERVICES_JSON:
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Apply Android manifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\
    <uses-permission android:name="android.permission.INTERNET"/>\
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
    <uses-permission android:name="android.permission.WAKE_LOCK"/>' "$MANIFEST"

      - name: Set minSdkVersion
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle

      - name: Add Google services Gradle plugin
        run: |
          sed -i "s/id(\"dev.flutter.flutter-gradle-plugin\")/id(\"dev.flutter.flutter-gradle-plugin\")\n    id(\"com.google.gms.google-services\")/" android/app/build.gradle.kts || true
          sed -i "/apply plugin: 'dev.flutter.flutter-gradle-plugin'/a apply plugin: 'com.google.gms.google-services'" android/app/build.gradle || true

      - name: Write .env
        run: cp .env.example .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release, unsigned)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
