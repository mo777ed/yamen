name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # android/ and ios/ are not committed to the repo, so generate them here.
      # This keeps the existing lib/ and pubspec.yaml untouched.
      - name: Generate android/ project files
        run: flutter create --org com.yemenchat --project-name yemen_chat --platforms=android .

      # google-services.json is required to build with Firebase.
      # Add its full content as a repo secret named GOOGLE_SERVICES_JSON:
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Check google-services.json is not empty
        run: |
          if [ ! -s android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is empty. Add the GOOGLE_SERVICES_JSON repo secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Apply Android manifest permissions, minSdk and google-services plugin
        run: python3 apply_android_setup.py

      - name: Write .env
        run: cp .env.example .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release, unsigned)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
