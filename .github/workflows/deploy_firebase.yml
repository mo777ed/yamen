name: Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy_firebase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Download repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Set up Node
      # =========================
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # =========================
      # 3. Write service account key
      # =========================
      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/gcp-key.json

      # =========================
      # 4. Check service account key
      # =========================
      - name: Check service account key is not empty
        run: |
          if [ ! -s /tmp/gcp-key.json ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is missing or empty."
            exit 1
          fi

      # =========================
      # 5. Check Firebase project ID
      # =========================
      - name: Check Firebase project ID
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::FIREBASE_PROJECT_ID secret is missing or empty."
            exit 1
          fi

          echo "Firebase project ID is configured."

      # =========================
      # 6. Deploy Firestore rules and indexes
      # =========================
      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore \
            --non-interactive
