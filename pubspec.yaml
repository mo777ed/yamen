name: yemen_chat
description: Yemen Chat (يمن شات) - Arabic-first social voice rooms app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.0.4
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_database: ^11.0.4
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4
  firebase_app_check: ^0.3.0+4

  # Realtime voice (behind VoiceService abstraction)
  livekit_client: ^2.2.0
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  cached_network_image: ^3.4.0
  image_picker: ^1.1.2

  # Infra
  intl: any
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.6+8
  share_plus: ^9.0.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/l10n/
    - assets/lottie/
    - assets/images/
